<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Import .3mf · maquette</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
tailwind.config = { theme: { extend: { colors: {
  bg: '#0c1016', surf: '#141b23', surf2: '#1a232d', line: '#263341', ink: '#e9eff6', sub: '#93a4b6', acc: '#00ae42',
} } } };
</script>
<style>
  html { font-size: 14.4px; }
  body { background: #0c1016; color: #e9eff6; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
  [data-lucide] { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
  .seg[aria-pressed=true] { background: #00ae42; color: #fff; font-weight: 600; }
  .field { background: #0c1016; border: 1px solid #263341; border-radius: 6px; padding: 5px 8px; width: 100%; font-size: 13px; }
  .lbl { font-size: 11px; color: #93a4b6; margin-bottom: 3px; display: block; }
  .auto { box-shadow: inset 2px 0 0 #00ae42; } /* value filled from the file */
  .thumb { background: repeating-linear-gradient(45deg, #1a232d 0 6px, #202b37 6px 12px); }
</style>
</head>
<body class="min-h-screen">

<!-- guided tour: not part of the app -->
<div class="sticky top-0 z-[60] border-b border-line bg-surf">
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 px-4 py-3 text-sm">
    <span><span class="font-semibold">Nouveau projet · import .3mf</span> <span class="text-sub">· maquette, données fictives</span></span>
    <span class="ml-auto flex flex-wrap items-center gap-3 text-xs">
      <span class="text-sub">Étape</span>
      <span class="inline-flex overflow-hidden rounded-lg border border-line">
        <button class="seg px-2.5 py-1" data-step="1">1 · Avant</button>
        <button class="seg px-2.5 py-1" data-step="1.5">2 · Tranchage serveur</button>
        <button class="seg px-2.5 py-1" data-step="2">3 · Vérification des plaques</button>
        <button class="seg px-2.5 py-1" data-step="3">4 · Tâches créées</button>
      </span>
    </span>
  </div>
</div>

<div class="fixed inset-0 top-[49px] bg-black/60"></div>

<!-- the drawer -->
<div class="fixed bottom-0 right-0 top-[49px] z-50 flex w-full max-w-[1100px] flex-col border-l border-line bg-surf shadow-2xl">
  <div class="flex items-center gap-3 border-b border-line px-4 py-3">
    <h2 class="text-base font-semibold">Nouveau projet</h2>
    <i data-lucide="x" class="ml-auto text-lg text-sub"></i>
  </div>

  <div class="grid min-h-0 flex-1 grid-cols-[minmax(0,1fr)_288px]">
    <div class="flex flex-col gap-3 overflow-y-auto border-r border-line p-4">

      <!-- section 1 -->
      <div class="rounded-xl border border-line bg-surf2">
        <div class="flex items-center gap-2 px-3 py-2.5">
          <span class="flex h-5 w-5 items-center justify-center rounded-full bg-line text-[11px]">1</span>
          <span class="font-semibold">Travail</span>
          <span id="hint" class="ml-auto text-xs text-sub"></span>
          <i data-lucide="chevron-up" class="text-sub"></i>
        </div>
        <div class="border-t border-line p-3">
          <div id="tasks" class="flex flex-col gap-2"></div>
          <div id="review"></div>
          <div id="actions" class="mt-3 flex items-center gap-2">
            <button class="rounded-lg border border-line px-3 py-1.5 text-sm text-sub"><i data-lucide="plus"></i> Ajouter une tâche</button>
            <button id="importBtn" class="rounded-lg border border-acc/60 bg-acc/10 px-3 py-1.5 text-sm text-acc hover:bg-acc/20"><i data-lucide="box"></i> Importer un .3mf</button>
            <span class="text-xs text-sub">ou glisser le fichier ici</span>
          </div>
        </div>
      </div>

      <div class="rounded-xl border border-line bg-surf2 px-3 py-2.5">
        <div class="flex items-center gap-2">
          <span class="flex h-5 w-5 items-center justify-center rounded-full bg-line text-[11px]">2</span>
          <span class="font-semibold">Client</span>
          <span class="ml-auto text-xs text-sub">Aucun client</span>
          <i data-lucide="chevron-down" class="text-sub"></i>
        </div>
      </div>
    </div>

    <!-- rail -->
    <div class="flex flex-col p-4 text-sm">
      <div class="mb-2 text-[11px] uppercase tracking-wide text-sub">Récapitulatif</div>
      <div id="rail" class="flex flex-col gap-1.5"></div>
      <div class="mt-3 flex justify-between border-t border-line pt-3"><span class="font-semibold">Total</span><span id="total" class="font-semibold tabular-nums"></span></div>
      <button class="mt-auto rounded-lg bg-acc/40 px-3 py-2 font-semibold text-white/70">Créer le projet</button>
    </div>
  </div>
</div>

<script>
const plates = [
  { n: 1, name: 'Marteaux', named: true, printer: 'X1C', mat: 'PETG', color: '#111111', colorName: 'Noir', fil: 'PETG HF Noir · Bambu', filOk: true,
    time: '6 h 05', g: 76.6, price: 4200, objs: [[2, 'marteau', '120×30×50']] },
  { n: 2, name: 'Manches + embouts', named: true, printer: 'X1C', mat: 'PLA', color: '#e5e5e5', colorName: 'Blanc', fil: null, filOk: false,
    time: '2 h 40', g: 41.2, price: null, objs: [[4, 'manche', '18×18×140'], [4, 'embout', '22×22×12']] },
  { n: 3, name: 'Plaque 3', named: false, printer: 'X1C', mat: 'PETG', color: '#111111', colorName: 'Noir', fil: 'PETG HF Noir · Bambu', filOk: true,
    time: '0 h 55', g: 12.9, price: 900, objs: [[1, 'support mural', '80×45×22']] },
];
const fmt = (v) => v == null ? '—' : v.toLocaleString('fr-FR') + ' XPF';
const note = (p) => p.objs.map(([q, n, d]) => `${q} x ${n} [${d}mm]`).join('\n');
const sw = (c) => `<span class="inline-block h-3 w-3 rounded-full border border-white/20 align-[-1px]" style="background:${c}"></span>`;
let step = 1;

function reviewHtml() {
  return `
  <div class="rounded-lg border border-acc/40 bg-bg">
    <div class="flex items-center gap-2 border-b border-line px-3 py-2 text-sm">
      <i data-lucide="box" class="text-acc"></i>
      <span class="font-semibold">Outils_client_v3.3mf</span>
      <span class="text-sub">· 3 plaques · tranché par le serveur en 48 s</span>
      <i data-lucide="x" class="ml-auto text-sub"></i>
    </div>
    ${plates.map((p) => `
    <div class="flex items-start gap-3 border-b border-line px-3 py-2.5 text-sm">
      <input type="checkbox" checked class="mt-1 accent-[#00ae42]">
      <div class="thumb h-14 w-14 flex-shrink-0 rounded-md border border-line"></div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2">
          <span class="font-semibold">${p.name}</span>
          ${p.named ? '' : '<span class="rounded bg-line px-1.5 py-0.5 text-[10px] text-sub">plaque sans nom</span>'}
        </div>
        <div class="mt-0.5 whitespace-pre-line text-xs text-sub">${note(p)}</div>
      </div>
      <div class="w-[210px] flex-shrink-0 text-xs">
        <div class="text-sub">${p.printer} · ${sw(p.color)} ${p.mat} ${p.colorName}</div>
        ${p.filOk
          ? `<div class="mt-1 text-ink"><i data-lucide="check" class="text-acc"></i> ${p.fil}</div>`
          : `<div class="mt-1 flex items-center gap-1 rounded border border-amber-500/50 bg-amber-500/10 px-1.5 py-1 text-amber-300"><i data-lucide="triangle-alert"></i> 3 filaments PLA Blanc — choisir <i data-lucide="chevron-down" class="ml-auto"></i></div>`}
      </div>
      <div class="w-[120px] flex-shrink-0 text-right text-xs tabular-nums">
        <div>${p.time} · ${p.g.toLocaleString('fr-FR')} g</div>
        <div class="mt-1 font-semibold ${p.price == null ? 'text-amber-300' : ''}">${fmt(p.price)}</div>
      </div>
    </div>`).join('')}
    <div class="flex items-center gap-2 px-3 py-2.5">
      <span class="text-xs text-sub">Une tâche « Impression 3D » par plaque cochée.</span>
      <button class="ml-auto rounded-lg border border-line px-3 py-1.5 text-sm text-sub">Annuler</button>
      <button id="confirm" class="rounded-lg bg-acc px-3 py-1.5 text-sm font-semibold text-white">Ajouter 3 tâches</button>
    </div>
  </div>`;
}

function slicingHtml() {
  return `
  <div class="rounded-lg border border-acc/40 bg-bg">
    <div class="flex items-center gap-2 border-b border-line px-3 py-2 text-sm">
      <i data-lucide="box" class="text-acc"></i>
      <span class="font-semibold">Outils_client_v3.3mf</span>
      <span class="text-sub">· 3 plaques · projet Bambu Studio</span>
      <i data-lucide="x" class="ml-auto text-sub"></i>
    </div>
    <div class="px-3 py-4 text-sm">
      <div class="flex items-center gap-2"><i data-lucide="loader" class="animate-spin text-acc"></i> Tranchage en cours — plaque 2 / 3 <span class="ml-auto text-xs tabular-nums text-sub">0:31</span></div>
      <div class="mt-2 h-1.5 overflow-hidden rounded bg-line"><div class="h-full w-[55%] bg-acc"></div></div>
      <div class="mt-2 text-xs text-sub">Le fichier est tranché avec ses propres réglages pour obtenir durée et poids. Vous pouvez remplir le client pendant ce temps.</div>
    </div>
  </div>`;
}

function taskHtml(p, open) {
  const head = `
    <div class="flex items-center gap-2 px-3 py-2 text-sm">
      <i data-lucide="grip-vertical" class="text-sub"></i>
      <span class="font-semibold">${p.name}</span>
      <span class="rounded bg-acc/15 px-1.5 py-0.5 text-[10px] text-acc">Impression 3D</span>
      <span class="rounded bg-line px-1.5 py-0.5 text-[10px] text-sub"><i data-lucide="box"></i> .3mf · plaque ${p.n}</span>
      ${p.filOk ? '' : '<span class="text-amber-400" title="Filament à choisir"><i data-lucide="triangle-alert"></i></span>'}
      <span class="ml-auto tabular-nums ${p.price == null ? 'text-amber-300' : ''}">${fmt(p.price)}</span>
      <i data-lucide="${open ? 'chevron-up' : 'chevron-down'}" class="text-sub"></i>
      <i data-lucide="x" class="text-sub"></i>
    </div>`;
  if (!open) return `<div class="rounded-lg border border-line bg-bg">${head}</div>`;
  return `
  <div class="rounded-lg border border-acc/40 bg-bg">${head}
    <div class="border-t border-line p-3">
      <label class="lbl">Nom de la tâche</label>
      <input class="field auto mb-3" value="${p.name}">
      <div class="rounded-lg border border-line p-3">
        <div class="mb-2 flex items-center gap-2 text-sm font-semibold"><i data-lucide="printer" class="text-acc"></i> Impression 3D</div>
        <div class="grid grid-cols-4 gap-2">
          <div><label class="lbl">Imprimante</label><input class="field auto" value="${p.printer}"></div>
          <div class="col-span-2"><label class="lbl">Filament</label><input class="field auto" value="${p.fil ?? ''}"></div>
          <div><label class="lbl">Couleur</label><input class="field" value="" placeholder="à saisir"></div>
          <div><label class="lbl">Poids (g)</label><input class="field auto" value="${p.g.toLocaleString('fr-FR')}"></div>
          <div><label class="lbl">Durée</label><input class="field auto" value="${p.time}"></div>
          <div><label class="lbl">Quantité</label><input class="field" value="1"></div>
          <div><label class="lbl">Prix</label><input class="field auto" value="${fmt(p.price)}"></div>
        </div>
        <label class="lbl mt-3">Note <span class="text-sub/70">(ligne « Info » du devis)</span></label>
        <textarea class="field auto" rows="${p.objs.length + 1}">${note(p)}</textarea>
        <div class="mt-2 text-[11px] text-sub"><span class="mr-1 inline-block h-2.5 w-0.5 bg-acc align-[-1px]"></span> rempli depuis le fichier — reste modifiable</div>
      </div>
    </div>
  </div>`;
}

function render() {
  document.querySelectorAll('[data-step]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.step == step));
  const done = step === 3;
  document.getElementById('tasks').innerHTML = done ? plates.map((p, i) => taskHtml(p, i === 0)).join('') : '';
  document.getElementById('review').innerHTML = step === 2 ? reviewHtml() : step === 1.5 ? slicingHtml() : '';
  document.getElementById('actions').style.display = step === 2 || step === 1.5 ? 'none' : 'flex';
  document.getElementById('hint').textContent = done ? '2 / 3 tâches chiffrées' : 'Aucune tâche';
  document.getElementById('rail').innerHTML = done
    ? plates.map((p) => `<div class="flex justify-between gap-2"><span class="truncate text-sub">${p.name}</span><span class="tabular-nums ${p.price == null ? 'text-amber-300' : ''}">${fmt(p.price)}</span></div>`).join('')
    : '<span class="text-sub">Aucune tâche</span>';
  document.getElementById('total').textContent = done ? fmt(5100) : fmt(0);
  lucide.createIcons();
  document.getElementById('confirm')?.addEventListener('click', () => { step = 3; render(); });
}
document.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => { step = +b.dataset.step; render(); }));
document.getElementById('importBtn').addEventListener('click', () => { step = 1.5; render(); });
render();
</script>
</body>
</html>
