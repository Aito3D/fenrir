name: Publish Image

# Continuous delivery: when CI finishes green for a commit on main, build the
# production image for amd64 + arm64 and push it to GHCR as
#
#   ghcr.io/<owner>/<repo>:latest       the deploy channel — always the newest
#                                       green commit on main (or a manual
#                                       re-deploy / rollback, see below)
#   ghcr.io/<owner>/<repo>:sha-<short>  immutable, one per published commit
#   ghcr.io/<owner>/<repo>:<version>    on `v*` tag pushes (tag minus the `v`)
#
# The production host pulls `:latest`. Nothing else runs here.
#
# Manual use (re-deploy or roll back): Run workflow with `ref` set to any
# commit/branch/tag. It must have a successful "CI" run recorded for it; the
# publish is refused otherwise, so a red commit can never ship by hand. A tag
# push is gated the same way — tag a commit that CI already passed.
#
# Each platform is built natively on its own runner (QEMU-emulated arm64 takes
# 30+ minutes for the pip install alone) and pushed by digest. The merge job
# then stitches the two digests into one multi-arch manifest list and applies
# the tags, so no tag ever points at a half-built image.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch or tag to publish as :latest (must have a green CI run)
        required: false
        default: main

# Serialise publishes; never cancel one that is in flight — a cancelled merge
# job would leave per-platform digests pushed with no tag pointing at them.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  # ============================================================================
  # Resolve what to build and prove it passed CI
  # ============================================================================

  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    # For workflow_run, only a green CI counts. The other triggers verify below.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      branch: ${{ steps.target.outputs.branch }}
      short: ${{ steps.target.outputs.short }}
      version: ${{ steps.target.outputs.version }}
      latest: ${{ steps.target.outputs.latest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve target commit and tags
        id: target
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_REF: ${{ github.event.inputs.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=""
          latest=true
          branch=main
          case "$EVENT" in
            workflow_run)
              sha="$RUN_SHA"
              branch="$RUN_BRANCH"
              ;;
            push)
              # Tag push: publish the version tag only. `latest` keeps tracking
              # main so a release tag on an older commit can't roll production back.
              sha="$(git rev-parse --verify "${REF_NAME}^{commit}")"
              version="${REF_NAME#v}"
              latest=false
              ;;
            workflow_dispatch)
              sha="$(git rev-parse --verify "${INPUT_REF}^{commit}")"
              # Keep the branch name for the image's .git/HEAD when a branch was given.
              if git show-ref --verify --quiet "refs/remotes/origin/${INPUT_REF}"; then
                branch="$INPUT_REF"
              fi
              ;;
          esac
          {
            echo "sha=$sha"
            echo "short=$(git rev-parse --short=7 "$sha")"
            echo "branch=$branch"
            echo "version=$version"
            echo "latest=$latest"
            # GHCR requires a lowercase repository path; github.repository keeps the org's casing.
            echo "image=ghcr.io/${REPO,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $sha ($(git log -1 --format=%s "$sha"))"

      - name: Require a green CI run for the target (tag push and manual only)
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          conclusion="$(gh run list --workflow CI --commit "$SHA" --status success --limit 1 --json conclusion --jq '.[0].conclusion // empty')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful CI run found for $SHA — refusing to publish."
            exit 1
          fi
          echo "CI is green for $SHA."

  # ============================================================================
  # Build one platform per native runner, push by digest
  # ============================================================================

  build:
    name: Build ${{ matrix.platform }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Point .git/HEAD at the source branch
        # `ref: <sha>` leaves HEAD detached. The Dockerfile copies .git/HEAD into
        # the image so detect_current_branch() can report the branch Bambuddy was
        # built from; a bare SHA there would make it fall back to "main" silently.
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: git checkout -q -B "$BRANCH" "$SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.image }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ needs.resolve.outputs.image }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          # Artifact names cannot contain "/", so use the arch half of the platform.
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ============================================================================
  # Merge the per-platform digests into one tagged manifest list
  # ============================================================================

  merge:
    name: Tag multi-arch manifest
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.resolve.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ needs.resolve.outputs.latest }}
            type=raw,value=${{ needs.resolve.outputs.version || 'none' }},enable=${{ needs.resolve.outputs.version != '' }}
            type=raw,value=sha-${{ needs.resolve.outputs.short }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          tags="$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Summary
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          first="$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
          docker buildx imagetools inspect "$first"
          {
            echo "### Published"
            echo
            echo "Commit \`$SHA\`"
            echo
            jq -r '.tags[] | "- `\(.)`"' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
