services:
  # Backend unit tests
  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: backend-test
    container_name: fenrir-backend-test
    volumes:
      - ./backend:/app/backend:ro
    environment:
      - TESTING=1
      - PYTHONUNBUFFERED=1

  # Frontend unit tests
  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
      target: frontend-test
    container_name: fenrir-frontend-test
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./frontend/tests:/app/frontend/tests:ro

  # Integration test - full application
  integration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fenrir-integration-test
    ports:
      - "8001:8000"
    environment:
      - TESTING=1
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - integration_test_data:/app/data

# There is deliberately no `integration-test-runner` service. It used to run
# `pytest backend/tests/integration/` in an image built from Dockerfile.test
# target backend-test — byte for byte the same image, interpreter and code the
# `backend-test` service above already runs `pytest backend/tests/` (the
# superset) in. The one thing that could have made it a distinct test, the
# FENRIR_TEST_URL=http://integration:8000 it set so the suite would exercise
# the live container next to it, was read by nothing: no backend module ever
# looked the variable up, so the tests built their own in-process TestClient
# exactly as they do everywhere else, and `depends_on: integration` bought a
# healthy container that no assertion touched.
#
# The live container is still worth starting — that is what the `integration`
# service is for — but what probes it is the health/API/static curl checks in
# test_docker.sh and .github/workflows/ci.yml, not a second copy of the unit
# suite. If you want container-level integration tests back, give them their
# own directory and make them actually read a base URL; do not reintroduce a
# service whose only difference is an env var nothing reads.

volumes:
  integration_test_data:
